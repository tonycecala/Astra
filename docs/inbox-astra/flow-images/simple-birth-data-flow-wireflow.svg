<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Simple Astrology Birth Data Flow</title>
  <desc id="desc">Four mobile screens for subject, report and chart choices, birth details, and review.</desc>
  <defs>
    <style>
      .bg { fill: #080713; }
      .phone { fill: #101320; stroke: #2f2a47; stroke-width: 3; }
      .panel { fill: #151827; stroke: #3a3450; stroke-width: 2; }
      .active { fill: #2b2630; stroke: #d8b85d; stroke-width: 3; }
      .gold { fill: #f0c85b; }
      .ink { fill: #f7f1df; }
      .muted { fill: #a9a2bd; }
      .blue { fill: #8dd8f7; }
      .danger { fill: #f28aa3; }
      .line { stroke: #3a3450; stroke-width: 2; }
      .arrow { stroke: #d8b85d; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .h1 { font-size: 34px; font-weight: 800; }
      .h2 { font-size: 25px; font-weight: 800; }
      .body { font-size: 18px; font-weight: 600; }
      .small { font-size: 14px; font-weight: 600; }
      .tiny { font-size: 12px; font-weight: 700; text-transform: uppercase; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d8b85d" />
    </marker>
  </defs>
  <rect class="bg" width="1800" height="980" />
  <text class="gold h1" x="74" y="82">Simple Astrology Birth Data Flow</text>
  <text class="muted body" x="74" y="118">Astra alpha flow: choose the report, choose valid chart math, collect simple birth data, review before queueing.</text>

  <g transform="translate(70 170)">
    <rect class="phone" x="0" y="0" width="355" height="690" rx="34" />
    <text class="gold h2" x="28" y="62">1 Subject</text>
    <rect class="panel" x="28" y="96" width="299" height="72" rx="10" />
    <text class="tiny muted" x="48" y="124">SUBJECT</text>
    <text class="ink body" x="48" y="150">Tony Cecala</text>
    <rect class="panel" x="28" y="190" width="299" height="150" rx="12" />
    <text class="tiny gold" x="48" y="224">ALPHA PATH</text>
    <text class="muted small" x="48" y="254">Name first. Report and chart</text>
    <text class="muted small" x="48" y="278">choices come before birth details.</text>
    <rect class="active" x="28" y="560" width="128" height="48" rx="10" />
    <text class="ink body" x="62" y="591">Next</text>
  </g>

  <path class="arrow" d="M452 512 C494 512 514 512 556 512" />

  <g transform="translate(585 170)">
    <rect class="phone" x="0" y="0" width="355" height="690" rx="34" />
    <text class="gold h2" x="28" y="62">2 Report</text>
    <text class="tiny muted" x="28" y="106">REPORT</text>
    <g transform="translate(28 124)">
      <rect class="panel" x="0" y="0" width="91" height="62" rx="9" />
      <text class="ink small" x="17" y="37">Identity</text>
      <rect class="active" x="104" y="0" width="82" height="62" rx="9" />
      <text class="ink small" x="128" y="37">Core</text>
      <rect class="panel" x="199" y="0" width="91" height="62" rx="9" />
      <text class="ink small" x="226" y="37">Deep</text>
      <rect class="panel" x="0" y="76" width="138" height="62" rx="9" />
      <text class="ink small" x="25" y="113">Progressed</text>
      <rect class="panel" x="152" y="76" width="138" height="62" rx="9" />
      <text class="ink small" x="190" y="113">Synastry</text>
    </g>
    <text class="tiny muted" x="28" y="308">ZODIAC</text>
    <rect class="active" x="28" y="326" width="136" height="52" rx="9" />
    <text class="ink small" x="67" y="358">Tropical</text>
    <rect class="panel" x="178" y="326" width="136" height="52" rx="9" />
    <text class="ink small" x="224" y="358">Sidereal</text>
    <text class="tiny muted" x="28" y="422">HOUSES</text>
    <rect class="active" x="28" y="440" width="136" height="52" rx="9" />
    <text class="ink small" x="60" y="472">Whole Sign</text>
    <rect class="panel" x="178" y="440" width="136" height="52" rx="9" />
    <text class="ink small" x="220" y="472">Placidus</text>
    <rect class="panel" x="28" y="528" width="286" height="56" rx="10" />
    <text class="tiny muted" x="48" y="552">IF SYNASTRY</text>
    <text class="ink small" x="48" y="574">Comparison chart: choose saved chart</text>
  </g>

  <path class="arrow" d="M966 512 C1008 512 1028 512 1070 512" />

  <g transform="translate(1100 170)">
    <rect class="phone" x="0" y="0" width="355" height="690" rx="34" />
    <text class="gold h2" x="28" y="62">3 Birth Details</text>
    <rect class="panel" x="28" y="96" width="299" height="74" rx="10" />
    <text class="tiny muted" x="48" y="124">BIRTH DATE</text>
    <text class="ink body" x="48" y="150">1961-05-23</text>
    <text class="blue small" x="214" y="150">YYYY-MM-DD</text>
    <rect class="panel" x="28" y="192" width="299" height="74" rx="10" />
    <text class="tiny muted" x="48" y="220">BIRTH TIME OPTIONAL</text>
    <text class="ink body" x="48" y="246">09:30</text>
    <text class="blue small" x="254" y="246">HH:MM</text>
    <rect class="panel" x="28" y="288" width="299" height="74" rx="10" />
    <text class="tiny muted" x="48" y="316">PLACE SEARCH</text>
    <text class="ink body" x="48" y="342">New York, NY</text>
    <rect class="panel" x="28" y="384" width="299" height="74" rx="10" />
    <text class="tiny muted" x="48" y="412">TIMEZONE</text>
    <text class="ink body" x="48" y="438">America/New_York</text>
    <text class="muted small" x="28" y="526">Time, timezone, and place travel together.</text>
  </g>

  <path class="arrow" d="M1482 512 C1524 512 1544 512 1586 512" />

  <g transform="translate(1380 170)">
    <rect class="phone" x="0" y="0" width="355" height="690" rx="34" />
    <text class="gold h2" x="28" y="62">4 Review</text>
    <g transform="translate(28 100)">
      <rect class="panel" x="0" y="0" width="299" height="64" rx="10" />
      <text class="tiny muted" x="18" y="25">SUBJECT</text>
      <text class="ink small" x="18" y="49">Tony Cecala</text>
      <rect class="panel" x="0" y="78" width="299" height="64" rx="10" />
      <text class="tiny muted" x="18" y="103">REPORT</text>
      <text class="ink small" x="18" y="127">Deep</text>
      <rect class="panel" x="0" y="156" width="299" height="64" rx="10" />
      <text class="tiny muted" x="18" y="181">CHART</text>
      <text class="ink small" x="18" y="205">Tropical · Whole Sign</text>
      <rect class="panel" x="0" y="234" width="299" height="64" rx="10" />
      <text class="tiny muted" x="18" y="259">BIRTH DETAILS</text>
      <text class="ink small" x="18" y="283">1961-05-23 · 09:30 · New York</text>
      <rect class="active" x="0" y="378" width="299" height="54" rx="12" />
      <text class="ink body" x="54" y="412">Queue chart and report</text>
    </g>
  </g>
</svg>
